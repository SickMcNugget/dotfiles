line-length = 80
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = 80

[lint]
select = ["ALL"]
ignore = ["T201", "ERA001", "D213", "D203", "COM812", "ANN204", "ANN003", "S603"]

fixable = ["ALL"]

[lint.flake8-annotations]
mypy-init-return = true
